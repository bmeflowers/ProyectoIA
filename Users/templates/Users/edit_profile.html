<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Perfil</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f2f2f2; padding: 40px;">

  <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
    
    <h2 style="text-align: center; color: #333;">Editar Perfil</h2>

    <form method="post" enctype="multipart/form-data" style="margin-top: 20px;">
      {% csrf_token %}
      <div style="margin-bottom: 20px;">
        {{ form.as_p }}
      </div>
      <div style="text-align: center;">
        <button type="submit" style="background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
          Guardar
        </button>
      </div>
    </form>

    <div style="text-align: center; margin-top: 20px;">
      <a href="{% url 'Users:profile' %}" style="text-decoration: none; color: #007BFF;">← Volver al perfil</a>
    </div>
  </div>

</body>
</html>
