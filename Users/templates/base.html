<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Soul Track{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Puedes usar Tailwind, Bootstrap o tu propio CSS. Aquí uso algo básico. -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        nav {
            background-color: #333;
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 1rem;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .container {
            padding: 2rem;
        }
    </style>
</head>
<body>
    <nav>
        <div>
            <a href="{% url 'home' %}"><strong>SoulTrack</strong></a>
        </div>
        <div>
            {% if user.is_authenticated %}
                <span>Hola, {{ user.first_name }}!</span>
                <a href="{% url 'profile' %}">Mi Perfil</a>
                <a href="{% url 'tasks' %}">Tareas</a>
                <a href="{% url 'logout' %}">Cerrar sesión</a>
            {% else %}
                <a href="{% url 'login' %}">Iniciar sesión</a>
                <a href="{% url 'signup' %}">Registrarse</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}
        <!-- Contenido de la página -->
        {% endblock %}
    </div>
</body>
</html>
